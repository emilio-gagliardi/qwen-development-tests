# LiteLLM Proxy Configuration
# This file configures the LiteLLM proxy server

model_list:
  # Fast tier - for simple queries
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY
      
  # Balanced tier - for moderate complexity
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: os.environ/OPENAI_API_KEY
      
  # Advanced tier - for complex/nuanced queries
  - model_name: gpt-4-turbo
    litellm_params:
      model: openai/gpt-4-turbo
      api_key: os.environ/OPENAI_API_KEY
  
  # Alternative providers (uncomment and configure as needed)
  # - model_name: claude-3-sonnet
  #   litellm_params:
  #     model: anthropic/claude-3-sonnet-20240229
  #     api_key: os.environ/ANTHROPIC_API_KEY
  
  # - model_name: gemini-pro
  #   litellm_params:
  #     model: gemini/gemini-pro
  #     api_key: os.environ/GEMINI_API_KEY

# General settings
general_settings:
  master_key: sk-1234  # Change in production!
  
  # Enable logging
  enable_logging: true
  
  # Request timeout
  request_timeout: 600

# Router configuration (optional - for load balancing across multiple keys)
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 5
